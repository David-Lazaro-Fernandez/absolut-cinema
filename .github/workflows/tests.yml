# Pruebas en cada push a main y en cada pull request. Si pasan en main, mueve la rama `stable` a ese commit: es lo que
# el servidor despliega en los siguientes 15 min (deploy/update.sh). Si fallan, `stable` no se mueve y el commit queda en rojo.
# La rama `stable` la mueve solo este workflow; no se toca a mano.
name: pruebas y commit estable

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write     # para mover la rama stable

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: venv del dashboard y de la API
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt

      - name: make check (igual que el pre-push)
        # Sin data/snapshots.db, las pantallas usan la captura grabada.
        run: make check

      - name: marcar commit estable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git push --force origin "${GITHUB_SHA}:refs/heads/stable"
          echo "stable -> ${GITHUB_SHA}"
