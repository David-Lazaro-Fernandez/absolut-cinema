[browser]
gatherUsageStats = false

[server]
headless = true

# Paleta y tipografía: ver DESIGN.md. La fuente Archivo se carga desde Google Fonts en app.py.
[theme]
base = "light"
primaryColor = "#E31837"
backgroundColor = "#F6F6F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#191A1E"
linkColor = "#E31837"
borderColor = "#E4E5E9"
dataframeBorderColor = "#E4E5E9"
font = "Archivo, system-ui, sans-serif"
headingFont = "Archivo, system-ui, sans-serif"
headingFontWeights = [850, 800, 750, 700, 600, 600]
baseRadius = "6px"
buttonRadius = "999px"
showWidgetBorder = true
chartCategoricalColors = ["#E31837", "#191A1E", "#C9CBD0", "#9E0F26", "#F08497", "#5C6068"]
chartSequentialColors = ["#F7CDD5", "#F08497", "#EE5A74", "#E31837", "#C4142F", "#9E0F26", "#7A0C1E", "#5A0915", "#3D060E", "#260408"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
